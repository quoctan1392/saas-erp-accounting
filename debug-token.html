<!DOCTYPE html>
<html>
<head>
    <title>Debug JWT Token</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        .section { margin: 20px 0; padding: 10px; border: 1px solid #ccc; }
        .label { font-weight: bold; color: #0066cc; }
        .value { background: #f5f5f5; padding: 5px; margin: 5px 0; word-break: break-all; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h2>🔍 JWT Token Debug Tool</h2>
    
    <div class="section">
        <div class="label">1. localStorage Values:</div>
        <div class="value" id="localStorage-info"></div>
    </div>

    <div class="section">
        <div class="label">2. Access Token Decoded:</div>
        <div class="value" id="access-token-decoded"></div>
    </div>

    <div class="section">
        <div class="label">3. Tenant Access Token Decoded:</div>
        <div class="value" id="tenant-token-decoded"></div>
    </div>

    <div class="section">
        <div class="label">4. Tenant ID Comparison:</div>
        <div class="value" id="tenant-comparison"></div>
    </div>

    <div class="section">
        <div class="label">5. Test API Call:</div>
        <button onclick="testApiCall()">Test GET /api/items</button>
        <div class="value" id="api-result"></div>
    </div>

    <script>
        function parseJwt(token) {
            try {
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));
                return JSON.parse(jsonPayload);
            } catch (e) {
                return { error: e.message };
            }
        }

        // Display localStorage values
        const localStorageInfo = {
            accessToken: localStorage.getItem('accessToken') ? 'EXISTS (' + localStorage.getItem('accessToken').substring(0, 30) + '...)' : 'MISSING',
            refreshToken: localStorage.getItem('refreshToken') ? 'EXISTS' : 'MISSING',
            tenantAccessToken: localStorage.getItem('tenantAccessToken') ? 'EXISTS (' + localStorage.getItem('tenantAccessToken').substring(0, 30) + '...)' : 'MISSING',
            selectedTenantId: localStorage.getItem('selectedTenantId') || 'MISSING',
            currentTenant: localStorage.getItem('currentTenant') ? JSON.parse(localStorage.getItem('currentTenant')) : 'MISSING',
            user: localStorage.getItem('user') ? JSON.parse(localStorage.getItem('user')) : 'MISSING'
        };
        document.getElementById('localStorage-info').innerText = JSON.stringify(localStorageInfo, null, 2);

        // Decode access token
        const accessToken = localStorage.getItem('accessToken');
        if (accessToken) {
            const decoded = parseJwt(accessToken);
            document.getElementById('access-token-decoded').innerText = JSON.stringify(decoded, null, 2);
        } else {
            document.getElementById('access-token-decoded').innerText = 'No access token found';
        }

        // Decode tenant access token
        const tenantToken = localStorage.getItem('tenantAccessToken');
        if (tenantToken) {
            const decoded = parseJwt(tenantToken);
            document.getElementById('tenant-token-decoded').innerText = JSON.stringify(decoded, null, 2);
        } else {
            document.getElementById('tenant-token-decoded').innerText = 'No tenant access token found';
        }

        // Compare tenant IDs
        const selectedTenantId = localStorage.getItem('selectedTenantId');
        const currentTenant = localStorage.getItem('currentTenant') ? JSON.parse(localStorage.getItem('currentTenant')) : null;
        const tenantTokenDecoded = tenantToken ? parseJwt(tenantToken) : null;
        
        let comparison = '';
        comparison += 'selectedTenantId: ' + (selectedTenantId || 'MISSING') + '\n';
        comparison += 'currentTenant.id: ' + (currentTenant?.id || 'MISSING') + '\n';
        comparison += 'tenantAccessToken.tenantId: ' + (tenantTokenDecoded?.tenantId || 'MISSING') + '\n';
        
        const allMatch = selectedTenantId && currentTenant?.id && tenantTokenDecoded?.tenantId &&
                        selectedTenantId === currentTenant.id && 
                        selectedTenantId === tenantTokenDecoded.tenantId;
        
        comparison += '\n' + (allMatch ? '✅ All tenant IDs MATCH' : '❌ Tenant IDs DO NOT MATCH');
        
        document.getElementById('tenant-comparison').innerText = comparison;

        // Test API call
        async function testApiCall() {
            const resultDiv = document.getElementById('api-result');
            resultDiv.innerText = 'Testing...';
            
            try {
                const response = await fetch('http://localhost:3003/api/items', {
                    headers: {
                        'Authorization': 'Bearer ' + (localStorage.getItem('tenantAccessToken') || localStorage.getItem('accessToken')),
                        'x-tenant-id': localStorage.getItem('selectedTenantId') || ''
                    }
                });
                
                const data = await response.json();
                
                resultDiv.innerHTML = 
                    '<strong>Status:</strong> ' + response.status + ' ' + response.statusText + '<br>' +
                    '<strong>Response:</strong><pre>' + JSON.stringify(data, null, 2) + '</pre>';
                
                if (response.ok) {
                    resultDiv.innerHTML = '<span class="success">✅ Success!</span><br>' + resultDiv.innerHTML;
                } else {
                    resultDiv.innerHTML = '<span class="error">❌ Failed!</span><br>' + resultDiv.innerHTML;
                }
            } catch (error) {
                resultDiv.innerHTML = '<span class="error">❌ Error: ' + error.message + '</span>';
            }
        }
    </script>
</body>
</html>
